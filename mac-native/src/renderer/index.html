<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data: musicai:; media-src 'self' musicai:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https:"
    />
    <title>Music AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <clipPath id="cookie" clipPathUnits="objectBoundingBox"><path id="cookie-path" d="" /></clipPath>
        <clipPath id="cookie-big" clipPathUnits="objectBoundingBox"><path id="cookie-big-path" d="" /></clipPath>
      </defs>
    </svg>
    <div id="app">
      <aside id="sidebar">
        <div class="drag-strip"></div>
        <div class="brand">
          <img class="brand-logo" src="logo.png" alt="" />
          <span>Music AI</span>
        </div>
        <nav class="nav">
          <a data-route="home" class="nav-item"><span class="ms">home</span><span>Home</span></a>
          <a data-route="search" class="nav-item"><span class="ms">search</span><span>Search</span></a>
          <a data-route="library" class="nav-item"><span class="ms">library_music</span><span>Library</span></a>
          <a data-route="mixes" class="nav-item"><span class="ms">auto_awesome</span><span>AI mixes</span></a>
        </nav>
        <div class="side-title">Your playlists</div>
        <div id="side-playlists" class="side-playlists"></div>
        <div class="side-bottom">
          <a data-route="settings" class="nav-item"><span class="dot" id="pi-dot"></span><span id="pi-label">Pi</span></a>
          <a data-route="settings" class="nav-item"><span class="ms">settings</span><span>Settings</span></a>
        </div>
      </aside>

      <main id="main">
        <div class="drag-strip top"></div>
        <div id="view"></div>
      </main>

      <aside id="queue-panel" class="hidden">
        <div class="queue-head"><span>Up next</span><button class="icon-btn" id="queue-close" title="Close"><span class="ms">close</span></button></div>
        <div id="queue-list"></div>
      </aside>

      <footer id="player">
        <div class="p-left">
          <img id="p-art" alt="Open now playing" title="Open now playing" />
          <div class="p-meta">
            <div id="p-title" class="ellipsis">Nothing playing</div>
            <div id="p-artist" class="ellipsis muted"></div>
          </div>
          <button class="icon-btn" id="p-like" title="Like"><span class="ms">favorite</span></button>
        </div>
        <div class="p-center">
          <div class="p-buttons">
            <button class="icon-btn" id="p-shuffle" title="Shuffle"><span class="ms">shuffle</span></button>
            <button class="icon-btn tonal" id="p-prev" title="Previous"><span class="ms fill">skip_previous</span></button>
            <button class="play-btn" id="p-play" title="Play"><span class="ms fill" id="p-play-icon">play_arrow</span></button>
            <button class="icon-btn tonal" id="p-next" title="Next"><span class="ms fill">skip_next</span></button>
            <button class="icon-btn" id="p-repeat" title="Repeat"><span class="ms">repeat</span></button>
          </div>
          <div class="p-seek">
            <span id="p-time" class="muted">0:00</span>
            <input type="range" id="p-bar" class="m3-slider" min="0" max="1000" value="0" aria-label="Seek" />
            <span id="p-dur" class="muted">0:00</span>
          </div>
        </div>
        <div class="p-right">
          <button class="icon-btn" id="p-devices" title="Play on…"><span class="ms">devices</span><span class="dot mini" id="p-devices-dot"></span></button>
          <button class="icon-btn" id="p-queue" title="Up next"><span class="ms">queue_music</span></button>
          <span class="ms vol-icon">volume_up</span>
          <input type="range" id="p-vol" class="m3-slider small" min="0" max="100" value="80" aria-label="Volume" />
        </div>
      </footer>

      <div id="devices-popup" class="popup hidden"></div>

      <section id="nowplaying" class="hidden">
        <div class="np-bg" id="np-bg"></div>
        <div class="np-tint"></div>
        <div class="drag-strip np-drag"></div>
        <button class="icon-btn np-close" id="np-close" title="Close"><span class="ms">keyboard_arrow_down</span></button>
        <div class="np-layout">
          <div class="np-left">
            <div class="np-art-wrap" id="np-art-wrap"><img id="np-art" alt="" /></div>
          </div>
          <div class="np-right">
            <div class="np-label"><span class="ms fill">graphic_eq</span><span id="np-from">Now playing</span></div>
            <div id="np-title"></div>
            <div id="np-artist"></div>
            <div class="np-wave" id="np-wave" title="Seek">
              <svg viewBox="0 0 600 24" preserveAspectRatio="none">
                <defs>
                  <clipPath id="np-clip"><rect id="np-clip-rect" x="0" y="0" width="0" height="24" /></clipPath>
                </defs>
                <line x1="0" y1="12" x2="600" y2="12" class="np-track" />
                <g clip-path="url(#np-clip)"><path id="np-wave-path" class="np-active" d="" /></g>
              </svg>
            </div>
            <div class="np-times"><span id="np-time">0:00</span><span id="np-dur">0:00</span></div>
            <div class="np-controls">
              <button class="icon-btn np-small" id="np-shuffle" title="Shuffle"><span class="ms">shuffle</span></button>
              <button class="np-skip" id="np-prev" title="Previous"><span class="ms fill">skip_previous</span></button>
              <button class="np-play" id="np-play" title="Play"><span class="ms fill" id="np-play-icon">play_arrow</span></button>
              <button class="np-skip" id="np-next" title="Next"><span class="ms fill">skip_next</span></button>
              <button class="icon-btn np-small" id="np-repeat" title="Repeat"><span class="ms">repeat</span></button>
            </div>
            <div class="np-actions">
              <button class="np-pill" id="np-like"><span class="ms">favorite</span><span>Like</span></button>
              <button class="np-pill" id="np-devices"><span class="ms">devices</span><span>Play on</span></button>
              <button class="np-pill" id="np-lyrics-btn"><span class="ms">lyrics</span><span>Lyrics</span></button>
              <button class="np-pill" id="np-queue"><span class="ms">queue_music</span><span>Up next</span></button>
            </div>
            <div class="np-lyrics hidden" id="np-lyrics"></div>
            <div class="np-upnext hidden" id="np-upnext"></div>
          </div>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
      <audio id="audio" preload="auto"></audio>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
