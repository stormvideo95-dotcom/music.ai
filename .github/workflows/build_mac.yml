name: Build Music AI for Mac

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mac-native/**"
      - ".github/workflows/build_mac.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mac-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Smoke test YouTube engine (search, playlists, audio stream)
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee ../smoke.log

      - name: Build DMGs
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee ../build.log

      - name: Collect DMGs
        run: |
          mkdir -p ../out
          ls pack
          for f in pack/*.dmg; do
            case "$f" in
              *arm64*) cp "$f" "../out/MusicAI-Mac-AppleSilicon-${{ github.run_number }}.dmg" ;;
              *) cp "$f" "../out/MusicAI-Mac-Intel-${{ github.run_number }}.dmg" ;;
            esac
          done
          {
            echo "Apple Silicon (M1/M2/M3/M4) → MusicAI-Mac-AppleSilicon. Older Intel Macs → MusicAI-Mac-Intel."
            echo
            echo 'First open: right-click the app → Open. If macOS says it is damaged: xattr -cr "/Applications/Music AI.app"'
            echo
            echo "Engine smoke test:"
            echo '```'
            grep "\[smoke\]\|SMOKE_RESULT" ../smoke.log | cut -c1-300 || echo "no smoke output"
            echo '```'
          } > ../notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-pro-${{ github.run_number }}
          name: Music AI for Mac (Pro) build ${{ github.run_number }}
          body_path: notes.md
          files: out/*.dmg
          make_latest: false

      - name: Share build errors (readable without login)
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { tail -40 smoke.log 2>/dev/null; echo ----; grep -iE "error|failed" -A3 build.log 2>/dev/null | head -100; echo ----; tail -50 build.log 2>/dev/null; } > errors.txt
          gh release create "mac-pro-failed-${{ github.run_number }}" --prerelease --title "Mac Pro build ${{ github.run_number }} failed" --notes-file errors.txt --target "${{ github.sha }}"
