name: Build Music AI for Mac

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mac-app/**"
      - ".github/workflows/build_mac.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mac-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm i -g pnpm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee ../install.log

      - name: Build
        run: |
          set -o pipefail
          pnpm clean || true
          pnpm build 2>&1 | tee ../build.log
          pnpm electron-builder --mac dmg:arm64 dmg:x64 -p never 2>&1 | tee -a ../build.log

      - name: Collect DMGs
        run: |
          mkdir -p ../out
          ls pack
          for f in pack/*.dmg; do
            case "$f" in
              *arm64*) cp "$f" "../out/MusicAI-Mac-AppleSilicon-${{ github.run_number }}.dmg" ;;
              *) cp "$f" "../out/MusicAI-Mac-Intel-${{ github.run_number }}.dmg" ;;
            esac
          done
          ls -la ../out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-build-${{ github.run_number }}
          name: Music AI for Mac build ${{ github.run_number }}
          body: |
            Apple Silicon (M1/M2/M3/M4) → MusicAI-Mac-AppleSilicon. Older Intel Macs → MusicAI-Mac-Intel.
            First open: right-click the app → Open. If macOS says it is damaged, run in Terminal:
            xattr -cr "/Applications/Music AI.app"
          files: out/*.dmg
          make_latest: false

      - name: Share build errors (readable without login)
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { tail -80 install.log 2>/dev/null; echo ----; grep -iE "error|failed" -A3 build.log 2>/dev/null | head -120; echo ----; tail -60 build.log 2>/dev/null; } > errors.txt
          gh release create "mac-failed-${{ github.run_number }}" --prerelease --title "Mac build ${{ github.run_number }} failed" --notes-file errors.txt --target "${{ github.sha }}"
