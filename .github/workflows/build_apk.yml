name: Build Music AI APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "v14-port"]
    paths-ignore:
      - "**.md"
      - "taste-server/**"
      - "mac-app/**"
      - "mac-native/**"
      - "assets/musicai/**"
      - "desktopApp/**"
      - "iosApp/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --console=plain --no-scan :androidApp:assembleDebug --warning-mode summary \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" 2>&1 | tee build.log
        env:
          METROLIST_APPLICATION_ID: com.storm.musicai
          METROLIST_APP_NAME: Music AI

      - name: Rename APK
        run: |
          find androidApp/build/outputs/apk -name "*.apk"
          APK=$(find androidApp/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found $APK"
          mkdir -p out
          cp "$APK" out/MusicAI-build-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicAI-apk
          path: out/*.apk

      - name: Publish release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Music AI build ${{ github.run_number }}
          body: Install this APK on your phone. Same signature every build, so it updates over the old one.
          files: out/*.apk
          make_latest: true

      - name: Publish test prerelease (branch builds)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.ref_name }}-${{ github.run_number }}
          name: Music AI test build ${{ github.run_number }} (${{ github.ref_name }})
          body: Test build from the ${{ github.ref_name }} branch. Not the normal update yet.
          files: out/*.apk
          prerelease: true
          make_latest: false

      - name: Share build errors (readable without login)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -150; echo; tail -60 build.log; } > errors.txt || tail -200 build.log > errors.txt
          gh release create "failed-${{ github.run_number }}" --prerelease --title "Build ${{ github.run_number }} failed" --notes-file errors.txt --target "${{ github.sha }}"
